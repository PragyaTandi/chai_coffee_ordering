services:
  - type: web
    name: after-hours-cafe
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    # Free web services do not support pre-deploy commands.
    startCommand: pnpm migrate:production && node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
      - key: NITRO_HOST
        value: 0.0.0.0
      - key: AGENT_NATIVE_RELEASE_MIGRATIONS
        value: "1"
      - key: APP_URL
        value: https://after-hours-cafe.onrender.com
      - key: BETTER_AUTH_TRUSTED_ORIGINS
        value: https://after-hours-cafe.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: after-hours-cafe-db
          property: connectionString
      - key: DATABASE_URL_UNPOOLED
        fromDatabase:
          name: after-hours-cafe-db
          property: connectionString
      - key: STAFF_PASSWORD
        sync: false

databases:
  - name: after-hours-cafe-db
    databaseName: after_hours_cafe
    user: after_hours_cafe
    plan: free
    region: singapore
    ipAllowList: []
